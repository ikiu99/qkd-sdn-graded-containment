# Joint minimax: the adversary picks its intensity AND the defender picks its
# own parameters.
#
# The minimax block elsewhere fixes the defence at the calibration recipe used
# throughout the paper and lets only the attacker move. That leaves open whether
# the threshold policy's collapse is a property of thresholding or of the one
# threshold we chose. Here both sides choose: four thresholds for B1, and the
# full product of four isolation points, two throttle anchors and two routing
# weights for B3, each against the whole intensity grid.
#
# Read as: for each policy family, the best worst case any single parameter
# choice achieves, since a defender must commit before seeing the attack.
#
#   python -m sim.sweep --sweep config/sweep_joint_minimax.yaml --no-assert
base: config/attack_t3_otp.yaml
detector: {ablation: false}
output_dir: results/raw
variants:
