# Detector-only rows for the OFAT block, with the configuration prior OFF.
#
# GENERATED by a one-off script; the cells mirror OFAT_CELLS in scripts/figures.py.
#
# Why this sweep exists: the policy runs carry use_prior: true, because the
# policy consumes the prior.  Reading their AUC as a detection result breaks the
# rule the methodology states - under selection: top_keyflow the prior is
# computed from the same key-flow share the adversary selects on, so it scores
# near-perfectly while having detected nothing.  Every other detection figure
# filters on ~use_prior; these rows let the OFAT figure do it too.
#
#   python -m sim.sweep --sweep config/sweep_ofat_prior_off.yaml --no-assert
base: config/attack_t3_otp.yaml
detector: {ablation: false}
output_dir: results/raw
variants:
  # baseline setup
- {topology.name: net50, topology.path: data/topologies/net50.json, demand.km_mode: OTP, demand.lam: 0.228407, attack.f: 0.10, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # NSFNET, 14 nodes
- {topology.name: nsfnet, topology.path: data/topologies/nsfnet.json, demand.km_mode: OTP, demand.lam: 0.399902, attack.f: 0.10, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # US mesh, 24 nodes
- {topology.name: usnet, topology.path: data/topologies/usnet.json, demand.km_mode: OTP, demand.lam: 0.304542, attack.f: 0.10, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # AES re-keying
- {topology.name: net50, topology.path: data/topologies/net50.json, demand.km_mode: AES, demand.lam: 21.708982, attack.f: 0.10, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # 5% relays taken
- {topology.name: net50, topology.path: data/topologies/net50.json, demand.km_mode: OTP, demand.lam: 0.228407, attack.f: 0.05, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # 20% relays taken
- {topology.name: net50, topology.path: data/topologies/net50.json, demand.km_mode: OTP, demand.lam: 0.228407, attack.f: 0.20, attack.selection: random, noise.scale: 1.0, detector.alpha: 0.05, detector.lam_s: 10.5000, detector.theta_0: 0.2447, detector.use_prior: false, policy.type: B0, attack.enabled: true}
  # 30% relays taken
