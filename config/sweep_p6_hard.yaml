# Phase 6, block C - the same frontier against a much quieter attacker.
#
# At the phase 1 defaults profile L reaches AUC 1.000, which phase 4 section 0
# itself calls a stop-and-fix condition.  gamma=0.10, delta=0.02 (a lie the size
# of the report noise) and q=0.005 put the features near the bottom of the
# healthy band, so the policy comparison faces an attacker that is genuinely
# hard to see rather than a trivial one.
#
#   python -m sim.sweep --sweep config/sweep_p6_hard.yaml --no-assert
