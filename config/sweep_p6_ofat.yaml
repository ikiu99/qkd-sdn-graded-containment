# Phase 6, block B - one factor at a time around the central cell.
#
# Centre: net50 / KM-OTP / f=0.10 / medium load / selection=random / noise 1.0 /
# alpha 0.05, which block A covers in full.  Each cell here moves exactly ONE
# dimension off that centre, as phase 1 section 11 prescribes - the full
# cartesian product would be ~29k runs and answers no question the OFAT design
# does not.
#
# Each topology and key mode anchors rho_start to ITS OWN quiet score
# (net50/OTP 0.1316, net50/AES 0.1301, nsfnet 0.2528, usnet 0.2207).
# Using net50's anchor everywhere throttled the whole of nsfnet, whose
# quiet network already sits at 0.25 - the lever was not comparable
# across the cells it was supposed to be compared across.
#
# Only G and E are run: the weak-signal and strong-signal profiles bracket the
# range, and P and G behave identically under every policy that needs a detector.
#
#   python -m sim.sweep --sweep config/sweep_p6_ofat.yaml --no-assert
base: config/attack_t3_otp.yaml
detector: {ablation: false}
output_dir: results/raw
