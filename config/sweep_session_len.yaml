# Session duration against the value of isolating early.
#
# Isolating a node blocks new admissions through it but lets sessions already
# routed through it drain (``policy.tear_down_on_isolate: false``).  Measured on
# the central cell the two settings differ by +-0.008 to 0.02 DRR, inside seed
# noise - but that is a statement about *this* traffic model, not about QKD
# networks.  Sessions here last 60-600 s against a 3 h post-t_c window, so the
# in-flight population at the moment of isolation is a rounding error.  A network
# carrying long-lived flows - a site-to-site tunnel, a storage replication link -
# has the opposite ratio, and there the drain-versus-evict choice is the whole
# of the policy's response time.
#
# lam is rescaled by the inverse of the mean session length at every point, so
# the offered key load stays where the calibration put it and the axis is session
# LENGTH rather than session length confounded with load:
#
#     E[T_s] = (T_s_min + T_s_max)/2      lam_k = lam_0 * E[T_s]_0 / E[T_s]_k
#
#   python -m sim.sweep --sweep config/sweep_session_len.yaml --no-assert
base: config/attack_t3_otp.yaml
detector: {ablation: false}
output_dir: results/raw
